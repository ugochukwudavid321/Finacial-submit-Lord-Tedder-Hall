function BackgroundMusic({ isDark }) {
  const audioRef = useRef(null);
  const buttonRef = useRef(null);
  const userPausedRef = useRef(false);
  const wasPlayingRef = useRef(false);
  const [isPlaying, setIsPlaying] = useState(false);
  const [audioFailed, setAudioFailed] = useState(false);
  useEffect(() => {
    try {
      const saved = localStorage.getItem('tedder_summit_music_paused');
      if (saved === 'true') {
        userPausedRef.current = true;
      }
    } catch (e) {}
    const audio = audioRef.current;
    if (!audio) return;
    audio.volume = 0.25;
    const onPlaying = () => setIsPlaying(true);
    const onPause = () => setIsPlaying(false);
    const onError = () => setAudioFailed(true);
    audio.addEventListener('playing', onPlaying);
    audio.addEventListener('pause', onPause);
    audio.addEventListener('error', onError);
    const interactionEvents = ['pointerup', 'click', 'touchend', 'keydown'];
    const removeInteractionListeners = () => {
      interactionEvents.forEach((evt) => {
        document.removeEventListener(evt, handleFirstInteraction, true);
      });
    };
    const tryPlay = () => {
      if (userPausedRef.current || audioFailed) return;
      const playPromise = audio.play();
      if (playPromise && typeof playPromise.then === 'function') {
        playPromise.then(() => {
          removeInteractionListeners();
        }).catch(() => {});
      }
    };
    const handleFirstInteraction = (e) => {
      if (buttonRef.current && buttonRef.current.contains(e.target)) {
        return;
      }
      if (userPausedRef.current) {
        removeInteractionListeners();
        return;
      }
      tryPlay();
    };
    if (!userPausedRef.current) {
      tryPlay();
      interactionEvents.forEach((evt) => {
        document.addEventListener(evt, handleFirstInteraction, true);
      });
    }
    const handleVisibility = () => {
      if (document.hidden) {
        if (!audio.paused) {
          wasPlayingRef.current = true;
          audio.pause();
        } else {
          wasPlayingRef.current = false;
        }
      } else {
        if (wasPlayingRef.current && !userPausedRef.current) {
          audio.play().catch(() => {});
        }
        wasPlayingRef.current = false;
      }
    };
    document.addEventListener('visibilitychange', handleVisibility);
    return () => {
      removeInteractionListeners();
      document.removeEventListener('visibilitychange', handleVisibility);
      audio.removeEventListener('playing', onPlaying);
      audio.removeEventListener('pause', onPause);
      audio.removeEventListener('error', onError);
    };
  }, []);
  const togglePlayback = () => {
    const audio = audioRef.current;
    if (!audio) return;
    if (audio.paused) {
      userPausedRef.current = false;
      try {
        localStorage.setItem('tedder_summit_music_paused', 'false');
      } catch (e) {}
      audio.play().catch(() => {});
    } else {
      userPausedRef.current = true;
      try {
        localStorage.setItem('tedder_summit_music_paused', 'true');
      } catch (e) {}
      audio.pause();
    }
  };
  return (
    <>
      <audio ref={audioRef} src="music.mp3" loop preload="auto" style={{ display: 'none' }} />
      {!audioFailed && (
        <button
          ref={buttonRef}
          type="button"
          onClick={togglePlayback}
          aria-label={isPlaying ? "Pause background music" : "Play background music"}
          className={`fixed bottom-6 left-6 z-40 w-[44px] h-[44px] rounded-full flex items-center justify-center border border-[#00B4D8] shadow-lg transition-transform hover:scale-105 active:scale-95 ${
            isDark ? 'bg-[#0D1B2A] text-[#00B4D8]' : 'bg-white text-slate-900'
          }`}
          title={isPlaying ? "Pause Music" : "Play Music"}
        >
          {isPlaying ? <Volume2 className="w-5 h-5"/> : <VolumeX className="w-5 h-5"/>}
        </button>
      )}
    </>
  );
}
function RegistrationModal({ isOpen, onClose, initialSkill, isDark }) {

      newErrors.email = 'Valid email address is required.';
    }

      newErrors.fullName = 'Full name (Surname First) is required.';

      newErrors.hallOther = 'Please specify your hall.';
    }

    return Object.keys(newErrors).length === 0;
  };

      newErrors.knowledgeLevel = 'Please select your current knowledge level.';

function ParticleCanvas() {
  const canvasRef = useRef(null);
  useEffect(() => {
    if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
      return;
    }
    const canvas = canvasRef.current;
    if (!canvas) return;
    const ctx = canvas.getContext('2d');
    let animationFrameId;
    let width = (canvas.width = window.innerWidth);
    let height = (canvas.height = window.innerHeight);
    const handleResize = () => {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
    };
    window.addEventListener('resize', handleResize);
    const particleCount = width < 768 ? 15 : Math.min(Math.floor(width / 25), 45);
    const particles = Array.from({ length: particleCount }, () => ({
      x: Math.random() * width,
      y: Math.random() * height,
      vx: (Math.random() - 0.5) * 0.4,
      vy: (Math.random() - 0.5) * 0.4,
      radius: Math.random() * 2 + 1,
      color: Math.random() > 0.5 ? 'rgba(0, 180, 216, 0.25)' : 'rgba(144, 224, 239, 0.15)'
    }));
    const render = () => {
      if (document.hidden) {
        animationFrameId = requestAnimationFrame(render);
        return;
      }
      ctx.clearRect(0, 0, width, height);
      for (let i = 0; i < particles.length; i++) {
        const p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        if (p.x < 0) p.x = width;
        if (p.x > width) p.x = 0;
        if (p.y < 0) p.y = height;
        if (p.y > height) p.y = 0;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
        ctx.fillStyle = p.color;
        ctx.fill();
        for (let j = i + 1; j < particles.length; j++) {
          const p2 = particles[j];
          const dx = p.x - p2.x;
          const dy = p.y - p2.y;
          const dist = Math.sqrt(dx * dx + dy * dy);
          if (dist < 120) {
            ctx.beginPath();
            ctx.moveTo(p.x, p.y);
            ctx.lineTo(p2.x, p2.y);
            ctx.strokeStyle = `rgba(0, 180, 216, ${0.08 * (1 - dist / 120)})`;
            ctx.lineWidth = 0.8;
            ctx.stroke();
          }
        }
      }
      animationFrameId = requestAnimationFrame(render);
    };
    render();
    return () => {
      window.removeEventListener('resize', handleResize);
      cancelAnimationFrame(animationFrameId);
    };
  }, []);
  return (
    <canvas 
      ref={canvasRef} 
      className="fixed inset-0 pointer-events-none z-0 opacity-80"
    />
  );
}

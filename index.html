function App() {
  const [mobileMenuOpen, setMobileMenuOpen] = useState(false);
  const [selectedSkill, setSelectedSkill] = useState('');
  const [activeTab, setActiveTab] = useState('all');
  const [submitted, setSubmitted] = useState(false);
  const [toastMessage, setToastMessage] = useState('');
  const [isDark, setIsDark] = useState(true);
  
  const [formData, setFormData] = useState({
    fullName: '',
    email: '',
    studentId: '',
    skill: '',
    department: '',
    phone: ''
  });

  useEffect(() => {
    if (selectedSkill) {
      setFormData(prev => ({ ...prev, skill: selectedSkill }));
    }
  }, [selectedSkill]);

  const handleSkillSelect = (skillTitle) => {
    setSelectedSkill(skillTitle);
    showToast(`Selected "${skillTitle}". Form updated!`);
    const formElement = document.getElementById('register');
    if (formElement) {
      formElement.scrollIntoView({ behavior: 'smooth' });
    }
  };

  const showToast = (msg) => {
    setToastMessage(msg);
    setTimeout(() => {
      setToastMessage('');
    }, 4000);
  };

  const handleInputChange = (e) => {
    const { name, value } = e.target;
    setFormData(prev => ({ ...prev, [name]: value }));
  };

  const handleSubmit = (e) => {
    e.preventDefault();
    if (!formData.fullName || !formData.email || !formData.skill) {
      showToast('Please fill in all required fields!');
      return;
    }
    setSubmitted(true);
    showToast('Registration submitted successfully!');
  };

  const scrollToSection = (id) => {
    setMobileMenuOpen(false);
    const element = document.getElementById(id);
    if (element) {
      element.scrollIntoView({ behavior: 'smooth' });
    }
  };

  const handleShare = () => {
    navigator.clipboard.writeText(window.location.href).then(() => {
      showToast('Page link copied to clipboard!');
    }).catch(() => {
      showToast('Failed to copy link.');
    });
  };

  return (
    <div className={`min-h-screen ${isDark ? 'bg-[#0D1B2A] text-slate-100' : 'bg-slate-50 text-slate-900'} font-sans selection:bg-[#00B4D8] selection:text-white relative overflow-x-hidden transition-colors duration-300`}>
      
      <ParticleCanvas/>

      {toastMessage && (
        <div className="fixed bottom-6 right-6 z-50 bg-[#00B4D8] text-slate-950 px-5 py-3 rounded-xl shadow-2xl font-bold flex items-center gap-3 animate-bounce border border-cyan-200">
          <Sparkles className="w-5 h-5"/>
          <span>{toastMessage}</span>
        </div>
      )}

      <header className={`sticky top-0 z-40 backdrop-blur-md ${isDark ? 'bg-[#0D1B2A]/80 border-slate-800/80' : 'bg-white/80 border-slate-200'} border-b transition-all duration-300`}>
        <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
          <div className="flex items-center justify-between h-20">
            <div 
              onClick={() => scrollToSection('hero')} 
              className="cursor-pointer flex items-center gap-3 group"
            >
              <div className="w-10 h-10 rounded-xl bg-gradient-to-tr from-[#00B4D8] to-[#90E0EF] flex items-center justify-center font-black text-slate-950 shadow-lg shadow-cyan-500/20 group-hover:scale-105 transition-transform">
                LTH
              </div>
              <div>
                <span className={`font-extrabold text-lg tracking-tight block ${isDark ? 'text-white' : 'text-slate-900'} leading-none`}>
                  LORD TEDDER HALL
                </span>
                <span className="text-xs text-[#00B4D8] font-medium tracking-wider uppercase">
                  Finance Summit '26
                </span>
              </div>
            </div>

            <nav className={`hidden md:flex items-center gap-8 font-medium text-sm ${isDark ? 'text-slate-300' : 'text-slate-600'}`}>
              <button onClick={() => scrollToSection('about')} className="hover:text-[#00B4D8] transition-colors">About</button>
              <button onClick={() => scrollToSection('speakers')} className="hover:text-[#00B4D8] transition-colors">Contributors</button>
              <button onClick={() => scrollToSection('skills')} className="hover:text-[#00B4D8] transition-colors">Skills Directory</button>
              <button onClick={() => scrollToSection('process')} className="hover:text-[#00B4D8] transition-colors">How It Works</button>
            </nav>

            <div className="hidden md:flex items-center gap-4">
              <button 
                onClick={() => setIsDark(!isDark)}
                className={`p-2.5 rounded-xl ${isDark ? 'bg-slate-800 text-amber-400' : 'bg-slate-200 text-slate-800'} hover:scale-105 transition-all`}
                title="Toggle Theme"
              >
                {isDark ? <Sun className="w-4 h-4"/> : <Moon className="w-4 h-4"/>}
              </button>

              <button 
                onClick={() => scrollToSection('register')} 
                className="relative inline-flex items-center justify-center px-6 py-2.5 text-sm font-bold text-slate-950 transition-all duration-300 bg-gradient-to-r from-[#00B4D8] via-[#90E0EF] to-[#00B4D8] bg-size-200 hover:bg-right rounded-xl shadow-lg shadow-cyan-500/25 hover:shadow-cyan-500/40 hover:-translate-y-0.5 active:translate-y-0"
              >
                Register Now
                <ArrowRight className="w-4 h-4 ml-1.5"/>
              </button>
            </div>

            <div className="md:hidden flex items-center gap-2">
              <button 
                onClick={() => setIsDark(!isDark)}
                className={`p-2 rounded-lg ${isDark ? 'bg-slate-800 text-amber-400' : 'bg-slate-200 text-slate-800'}`}
              >
                {isDark ? <Sun className="w-5 h-5"/> : <Moon className="w-5 h-5"/>}
              </button>

              <button 
                onClick={() => setMobileMenuOpen(!mobileMenuOpen)}
                className={`p-2 rounded-lg ${isDark ? 'bg-slate-800/60 text-slate-300' : 'bg-slate-200 text-slate-800'} hover:text-white focus:outline-none`}
              >
                {mobileMenuOpen ? <X className="w-6 h-6"/> : <Menu className="w-6 h-6"/>}
              </button>
            </div>
          </div>
        </div>

        {mobileMenuOpen && (
          <div className={`md:hidden ${isDark ? 'bg-[#1B263B] border-slate-700/60 text-slate-200' : 'bg-white border-slate-200 text-slate-800'} border-b px-4 pt-2 pb-6 space-y-3 animate-fadeIn`}>
            <button 
              onClick={() => scrollToSection('about')} 
              className="block w-full text-left px-3 py-2 rounded-lg font-medium hover:bg-slate-800/20"
            >
              About
            </button>
            <button 
              onClick={() => scrollToSection('speakers')} 
              className="block w-full text-left px-3 py-2 rounded-lg font-medium hover:bg-slate-800/20"
            >
              Contributors
            </button>
            <button 
              onClick={() => scrollToSection('skills')} 
              className="block w-full text-left px-3 py-2 rounded-lg font-medium hover:bg-slate-800/20"
            >
              Skills Directory
            </button>
            <button 
              onClick={() => scrollToSection('process')} 
              className="block w-full text-left px-3 py-2 rounded-lg font-medium hover:bg-slate-800/20"
            >
              How It Works
            </button>
            <button 
              onClick={() => scrollToSection('register')} 
              className="w-full mt-2 py-3 bg-[#00B4D8] text-slate-950 font-bold rounded-xl text-center shadow-lg shadow-cyan-500/20"
            >
              Register Now
            </button>
          </div>
        )}
      </header>

      <section id="hero" className="relative min-h-[calc(100vh-80px)] flex items-center justify-center pt-12 pb-24 px-4 sm:px-6 lg:px-8 overflow-hidden">
        <div className="max-w-5xl mx-auto text-center relative z-10">
          
          <div className={`inline-flex items-center gap-2 px-4 py-2 rounded-full ${isDark ? 'bg-cyan-950/60 border-[#00B4D8]/30 text-[#00B4D8]' : 'bg-cyan-50 border-cyan-200 text-cyan-700'} text-xs sm:text-sm font-semibold tracking-wide uppercase mb-8 shadow-inner animate-pulse`}>
            <Sparkles className="w-4 h-4"/>
            <span>Lord Tedder Hall Flagship Event</span>
          </div>

          <h1 className={`text-4xl sm:text-6xl md:text-7xl font-black tracking-tight ${isDark ? 'text-white' : 'text-slate-900'} mb-6 leading-none`}>
            2026 FINANCE SUMMIT <br className="hidden sm:inline" />
            <span className="bg-gradient-to-r from-[#00B4D8] via-[#90E0EF] to-[#E0A96D] bg-clip-text text-transparent">
              & SKILL ACQUISITION
            </span>
          </h1>

          <p className="text-2xl sm:text-3xl font-extrabold text-[#00B4D8] mb-6 tracking-wide">
            Learn. Earn. Grow.
          </p>

          <p className={`max-w-3xl mx-auto text-base sm:text-lg ${isDark ? 'text-slate-300' : 'text-slate-600'} leading-relaxed mb-10 font-normal`}>
            Discover practical skills, explore new income opportunities, and learn directly from Tedderites who are actively building successful businesses while navigating student life.
          </p>

          <div className="flex flex-wrap items-center justify-center gap-4 sm:gap-6 mb-12 text-sm font-medium">
            <div className={`flex items-center gap-2 px-4 py-2 rounded-lg ${isDark ? 'bg-slate-900/60 border-slate-800 text-slate-300' : 'bg-white border-slate-200 text-slate-700 shadow-sm'}`}>
              <MapPin className="w-4 h-4 text-[#00B4D8]"/>
              <span>Lord Tedder Hall, UI</span>
            </div>
            <div className={`flex items-center gap-2 px-4 py-2 rounded-lg ${isDark ? 'bg-slate-900/60 border-slate-800 text-slate-300' : 'bg-white border-slate-200 text-slate-700 shadow-sm'}`}>
              <Calendar className="w-4 h-4 text-[#00B4D8]"/>

function ParticleCanvas() {
  const canvasRef = useRef(null);

  useEffect(() => {
    if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
      return;
    }

    const canvas = canvasRef.current;
    if (!canvas) return;
    const ctx = canvas.getContext('2d');
    let animationFrameId;

    let width = (canvas.width = window.innerWidth);
    let height = (canvas.height = window.innerHeight);

    const handleResize = () => {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
    };

    window.addEventListener('resize', handleResize);

    const particleCount = width < 768 ? 15 : Math.min(Math.floor(width / 25), 45);
    const particles = Array.from({ length: particleCount }, () => ({
      x: Math.random() * width,
      y: Math.random() * height,
      vx: (Math.random() - 0.5) * 0.4,
      vy: (Math.random() - 0.5) * 0.4,
      radius: Math.random() * 2 + 1,
      color: Math.random() > 0.5 ? 'rgba(0, 180, 216, 0.25)' : 'rgba(144, 224, 239, 0.15)'
    }));

    const render = () => {
      if (document.hidden) {
        animationFrameId = requestAnimationFrame(render);
        return;
      }

      ctx.clearRect(0, 0, width, height);

      for (let i = 0; i < particles.length; i++) {
        const p = particles[i];
        p.x += p.vx;
        p.y += p.vy;

        if (p.x < 0) p.x = width;
        if (p.x > width) p.x = 0;
        if (p.y < 0) p.y = height;
        if (p.y > height) p.y = 0;

        ctx.beginPath();
        ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
        ctx.fillStyle = p.color;
        ctx.fill();

        for (let j = i + 1; j < particles.length; j++) {
          const p2 = particles[j];
          const dx = p.x - p2.x;
          const dy = p.y - p2.y;
          const dist = Math.sqrt(dx * dx + dy * dy);

          if (dist < 120) {
            ctx.beginPath();
            ctx.moveTo(p.x, p.y);
            ctx.lineTo(p2.x, p2.y);
            ctx.strokeStyle = `rgba(0, 180, 216, ${0.08 * (1 - dist / 120)})`;
            ctx.lineWidth = 0.8;
            ctx.stroke();
          }
        }
      }

      animationFrameId = requestAnimationFrame(render);
    };

    render();

    return () => {
      window.removeEventListener('resize', handleResize);
      cancelAnimationFrame(animationFrameId);
    };
  }, []);

  return (
    <canvas 
      ref={canvasRef} 
      className="fixed inset-0 pointer-events-none z-0 opacity-80"
    />
  );
}
